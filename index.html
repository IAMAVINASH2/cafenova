<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cafe Nova</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="site">
    <header class="topbar">
      <img class="brand-mark" src="assets/ada33aa43b4f656710015c815f5440a121debba1" alt="Cafe Nova">
      <nav>
        <a href="#home">Home</a>
        <a href="#flavors">Flavors</a>
        <a href="#about">About</a>
      </nav>
      <button class="menu" aria-label="Menu">☰</button>
    </header>

    <main id="home">
      <section class="hero">
        <div class="cups">
          <img src="assets/bf840dd5bb138bee3bdd4043bcee9fc96f786b1a" alt="Mocha Noir">
          <img src="assets/f1771ad0386d20aab5420e7249624a7b39d7a03c" alt="Vanilla Cloud">
          <img src="assets/eef434bf6492b3d72a7c16d3c073ac28ca9f6e4f" alt="Caramel Crush">
          <img src="assets/63ec797d9481ed2d06db0348dbb731f163e62793" alt="Berry Bliss">
        </div>
        <img class="hero-logo" src="assets/82d638cef1d0a50b9f3aff05aa57d56bee10aec" alt="Cafe Nova Coffee Cream Moments">
      </section>

      <section id="flavors" class="flavor-section">
        <p class="eyebrow">Flavors</p>
        <article class="flavor-card">
          <img src="assets/bf840dd5bb138bee3bdd4043bcee9fc96f786b1a" alt="Mocha Noir">
          <div class="flavor-copy">
            <h1>Mocha Noir</h1>
            <p>Rich chocolate and bold coffee blended into a smooth, indulgent moment.</p>
          </div>
        </article>
      </section>
    </main>
  </div>
<script src="script.js"></script>
</body>
</html>
